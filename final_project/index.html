
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PubMed Keyword and MeSH Lookup</title>

  <link rel="stylesheet" href="style.css">

  <script src="pubmed.js" defer></script>


</head>

<body>
  <h1>PubMed Article Lookup</h1>

  <form id="pubmed-form" novalidate>
    <label for="pubmed-id">PubMed ID:</label>

    <input
      type="text"
      id="pubmed-id"
      name="pubmedId"
      placeholder="e.g., 12345678"
      inputmode="numeric"
      aria-describedby="status"
      required
    >

    <button type="submit">Submit</button>
  </form>

  <p id="status" role="status" aria-live="polite"></p>

  <div id="results"></div>

</body>
</html>
